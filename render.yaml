# Render Blueprint for ExPress, free tier, hands-off: apply once with "New → Blueprint" in the Render dashboard
# (select this repository and branch), no values to type. Every secret is generated by Render (generateValue),
# the database wiring uses fromDatabase / fromService, and pushes to the branch redeploy automatically.
#
# Layout (all in one region so the private network works):
#   exw-ledger        free PostgreSQL 18. The ledger lives in database exw_ledger (owner exw_ledger_user).
#                     Render allows one free database per workspace, so the sample store gets its own role and
#                     database on the same instance: the API runs packages/database/src/bootstrap-store.ts at start,
#                     which creates role/database exw_store and revokes that role's CONNECT on the ledger database.
#   exw-api-k7d2      API with the worker loop inside (WORKER_IN_API=true; Render's free tier has no background workers)
#   exw-store-k7d2    NORTHSTAR sample store (separate origin, separate database role)
#   exw-portal-k7d2   Next Portal; forwards /api and /docs to the API over the private network
#
# Services use the native Node runtime (not the Dockerfile) because Render does not pass environment variables to
# Docker builds, and the Portal embeds PORTAL_URL / API_URL / STORE_URL at build time.
# Public URLs are predicted from the service names (https://<name>.onrender.com). If Render appends a suffix
# because a name is taken, update PORTAL_URL / API_URL / STORE_URL / WEBHOOK_ALLOWLIST on the three services and
# redeploy the Portal. Free instances sleep after inactivity (first request takes up to a minute) and free
# databases expire after 30 days: check Render's current terms.
databases:
  - name: exw-ledger
    databaseName: exw_ledger
    user: exw_ledger_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"

envVarGroups:
  - name: exw-shared
    envVars:
      - key: STORE_DB_PASSWORD # password of the sample store's database role, generated by Render, shared by API (bootstrap) and store
        generateValue: true

services:
  - type: web
    name: exw-api-k7d2
    runtime: node
    plan: free
    region: singapore
    branch: claude/express-completion-delivery-e92pt1
    buildCommand: npm install -g pnpm@11.19.0 && NODE_ENV=development pnpm install --frozen-lockfile && pnpm run build:server
    startCommand: node dist/packages/database/src/bootstrap-store.js && node dist/packages/database/src/migrate.js && node dist/apps/api/src/index.js
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: exw-shared
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DEMO_MODE
        value: public
      - key: LISTEN_HOST
        value: 0.0.0.0
      - key: WORKER_IN_API
        value: "true"
      - key: DATABASE_URL
        fromDatabase: {name: exw-ledger, property: connectionString}
      - key: STORE_DB_HOST
        fromDatabase: {name: exw-ledger, property: host}
      - key: ENCRYPTION_KEY # 256-bit value generated by Render as base64; config.ts accepts hex or base64 of 32 bytes
        generateValue: true
      - key: PORTAL_URL
        value: https://exw-portal-k7d2.onrender.com
      - key: API_URL
        value: https://exw-portal-k7d2.onrender.com/api
      - key: STORE_URL
        value: https://exw-store-k7d2.onrender.com
      - key: API_INTERNAL_HOSTPORT
        fromService: {type: web, name: exw-api-k7d2, property: hostport}
      - key: WEBHOOK_ALLOWLIST
        value: https://exw-store-k7d2.onrender.com/webhooks/express-wallet
      - key: SETTLEMENT_DELAY_SECONDS
        value: "60"

  - type: web
    name: exw-store-k7d2
    runtime: node
    plan: free
    region: singapore
    branch: claude/express-completion-delivery-e92pt1
    buildCommand: npm install -g pnpm@11.19.0 && NODE_ENV=development pnpm install --frozen-lockfile && pnpm run build:server
    startCommand: node dist/apps/demo-store/src/index.js
    healthCheckPath: /
    envVars:
      - fromGroup: exw-shared
      - key: NODE_VERSION
        value: "24.21.0"
      - key: DEMO_MODE
        value: public
      - key: LISTEN_HOST
        value: 0.0.0.0
      - key: DATABASE_URL # required by the shared config validation only; the store never opens the ledger database
        value: postgresql://unused:unused@127.0.0.1:1/unused
      - key: STORE_DB_HOST
        fromDatabase: {name: exw-ledger, property: host}
      - key: ENCRYPTION_KEY # the store's own key for its credential copy
        generateValue: true
      - key: PORTAL_URL
        value: https://exw-portal-k7d2.onrender.com
      - key: API_URL
        value: https://exw-portal-k7d2.onrender.com/api
      - key: STORE_URL
        value: https://exw-store-k7d2.onrender.com
      - key: API_INTERNAL_HOSTPORT
        fromService: {type: web, name: exw-api-k7d2, property: hostport}

  - type: web
    name: exw-portal-k7d2
    runtime: node
    plan: free
    region: singapore
    branch: claude/express-completion-delivery-e92pt1
    buildCommand: npm install -g pnpm@11.19.0 && NODE_ENV=development pnpm install --frozen-lockfile && pnpm run build
    startCommand: node node_modules/next/dist/bin/next start apps/portal --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /wallet
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORTAL_URL
        value: https://exw-portal-k7d2.onrender.com
      - key: API_URL
        value: https://exw-portal-k7d2.onrender.com/api
      - key: STORE_URL
        value: https://exw-store-k7d2.onrender.com
      - key: API_INTERNAL_HOSTPORT # baked into the /api and /docs rewrites at build time
        fromService: {type: web, name: exw-api-k7d2, property: hostport}
